services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mme
      POSTGRES_PASSWORD: mme
      POSTGRES_DB: mme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mme -d mme']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '3000:3000'
    volumes:
      - backup-data:/app/data/backups
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/ready']
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '5173:5173'

volumes:
  postgres-data:
  backup-data:
