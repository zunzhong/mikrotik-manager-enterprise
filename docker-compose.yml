services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mme
      POSTGRES_PASSWORD: mme
      POSTGRES_DB: mme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    volumes:
      - backup-data:/app/data/backups

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - server
    ports:
      - '5173:5173'

volumes:
  postgres-data:
  backup-data:
