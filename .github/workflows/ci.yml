# Add after typecheck steps

      - name: Run routeros-core tests
        run: pnpm --filter @mme/routeros-core test

      - name: Run server tests
        run: pnpm --filter @mme/server test || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage
            **/coverage
