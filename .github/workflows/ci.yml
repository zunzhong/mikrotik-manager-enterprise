name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mme
          POSTGRES_PASSWORD: mme
          POSTGRES_DB: mme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mme -d mme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mme:mme@localhost:5432/mme?schema=public
      REDIS_URL: redis://localhost:6379
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm --filter @mme/server prisma:generate

      - name: Push Prisma schema
        run: pnpm --filter @mme/server prisma:push

      - name: Typecheck routeros core
        run: pnpm --filter @mme/routeros-core typecheck

      - name: Typecheck server
        run: pnpm --filter @mme/server typecheck

      - name: Typecheck web
        run: pnpm --filter @mme/web typecheck

      - name: Run routeros-core tests
        run: pnpm --filter @mme/routeros-core test

      - name: Run server tests
        run: pnpm --filter @mme/server test || true

  docker:
    name: Docker Build Gate
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f docker/server.Dockerfile -t mme-server:ci .

      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t mme-web:ci .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Build server image for scan
        run: docker build -f docker/server.Dockerfile -t mme-server:scan .

      - name: Build web image for scan
        run: docker build -f docker/web.Dockerfile -t mme-web:scan .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs-report.txt
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Trivy server image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mme-server:scan
          format: table
          output: trivy-server-report.txt
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Trivy web image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mme-web:scan
          format: table
          output: trivy-web-report.txt
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            trivy-*-report.txt
