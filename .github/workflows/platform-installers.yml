name: Platform Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 4.1.7
      platform:
        description: Nền tảng cần build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - all
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows EXE Installer
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $packageVersion
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Cài dependencies và kiểm tra chất lượng
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'packaging/windows/MME-Control.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell installer script không hợp lệ.'
          }
          $scriptBytes = [IO.File]::ReadAllBytes((Resolve-Path 'packaging/windows/MME-Control.ps1'))
          if ($scriptBytes.Length -lt 3 -or $scriptBytes[0] -ne 0xEF -or $scriptBytes[1] -ne 0xBB -or $scriptBytes[2] -ne 0xBF) {
            throw 'MME-Control.ps1 phải sử dụng UTF-8 BOM để tương thích Windows PowerShell 5.1.'
          }
          $validationRoot = Join-Path $env:RUNNER_TEMP 'mme-powershell-validation'
          $validationLog = Join-Path $env:RUNNER_TEMP 'mme-powershell-validation.log'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File packaging/windows/MME-Control.ps1 validate -NoOpen -DataRoot $validationRoot `
            *> $validationLog
          Get-Content $validationLog -ErrorAction SilentlyContinue
          if ($LASTEXITCODE -ne 0) { throw 'MME-Control.ps1 không chạy được bằng Windows PowerShell 5.1.' }
          if (-not (Test-Path "$validationRoot\logs\bootstrap.log")) {
            throw 'Windows PowerShell không tạo được bootstrap.log.'
          }
          Remove-Item $validationRoot -Recurse -Force
          pnpm --filter @mme/server prisma:generate
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build MME Desktop native SQLite
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DATABASE_URL = 'file:./mme-build.db'
          pnpm --filter @mme/server prisma:generate:sqlite
          pnpm --filter @mme/server prisma:sql:sqlite
          pnpm --filter @mme/web build
          pnpm --filter @mme/routeros-core build
          pnpm --filter @mme/routeros-sdk build
          pnpm --filter @mme/server build
          pnpm --config.node-linker=hoisted --filter @mme/server deploy --legacy --prod artifacts/payload

          $prismaCli = 'artifacts/payload/node_modules/prisma/build/index.js'
          if (-not (Test-Path $prismaCli)) { throw 'Không tìm thấy Prisma CLI trong production payload hoisted.' }
          & node $prismaCli generate --schema artifacts/payload/prisma/schema.sqlite.prisma

          $sqliteEngine = Get-ChildItem 'artifacts/payload/node_modules' -Recurse -Filter 'query_engine-windows*.dll.node' |
            Where-Object { $_.FullName -match '[\\/]\.prisma[\\/]client[\\/]' } |
            Select-Object -First 1
          if (-not $sqliteEngine) { throw 'Không tìm thấy Prisma SQLite engine dành cho Windows trong native payload.' }

          Copy-Item apps/web/dist artifacts/payload/web -Recurse
          Copy-Item packaging artifacts/payload/packaging -Recurse
          Copy-Item project-docs/deployment/HUONG-DAN-CAI-DAT-WINDOWS.md artifacts/payload/HUONG-DAN-CAI-DAT-WINDOWS.md
          New-Item -ItemType Directory -Force artifacts/payload/runtime, artifacts/payload/service | Out-Null
          Copy-Item (Get-Command node).Source artifacts/payload/runtime/node.exe
          Invoke-WebRequest `
            'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe' `
            -OutFile artifacts/payload/service/MME.Service.exe

          $generatedSchema = Get-Content 'artifacts/payload/node_modules/.prisma/client/schema.prisma' -Raw
          if ($generatedSchema -notmatch 'provider\s*=\s*"sqlite"') {
            throw 'Prisma Client trong Windows payload không sử dụng SQLite.'
          }
          $payloadSmokeDb = (Join-Path (Resolve-Path 'artifacts').Path 'payload-smoke.db').Replace('\', '/')
          $env:DATABASE_URL = "file:$payloadSmokeDb"
          $env:NODE_ENV = 'production'
          $env:DEFAULT_ADMIN_EMAIL = 'smoke-test@example.com'
          $env:DEFAULT_ADMIN_PASSWORD = 'MME-Smoke-Test-Password-2026'
          $env:SQLITE_SCHEMA_SQL = (Resolve-Path 'artifacts/payload/prisma/schema.sqlite.sql').Path
          & node artifacts/payload/dist/scripts/setup-native.js
          if ($LASTEXITCODE -ne 0) { throw 'Windows payload không thể khởi tạo SQLite.' }
          Remove-Item $payloadSmokeDb -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path artifacts/payload/dist/server.js)) { throw 'Thiếu server build.' }
          if (-not (Test-Path artifacts/payload/web/index.html)) { throw 'Thiếu web build.' }
          if (-not (Test-Path artifacts/payload/prisma/schema.sqlite.sql)) { throw 'Thiếu SQLite schema.' }
          if (-not (Test-Path artifacts/payload/runtime/node.exe)) { throw 'Thiếu Node runtime.' }
          if (-not (Test-Path artifacts/payload/service/MME.Service.exe)) { throw 'Thiếu service wrapper.' }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=${{ steps.version.outputs.value }}" packaging/windows/mme-installer.iss

      - name: Smoke test cài đặt, nâng cấp không restart và gỡ cài đặt
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'artifacts/MikroTik-Manager-Enterprise-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Không tìm thấy Windows installer để kiểm thử.' }
          $artifactDir = (Resolve-Path 'artifacts').Path
          function Write-MMEDiagnostics {
            $diagnosticDir = "$env:ProgramData\MikroTik Manager Enterprise\logs"
            if (Test-Path $diagnosticDir) {
              Get-ChildItem $diagnosticDir -File | ForEach-Object {
                Write-Host "===== $($_.Name) ====="
                Get-Content $_.FullName -Tail 200 -ErrorAction Continue
              }
            }
            Get-Service MME -ErrorAction SilentlyContinue | Format-List Name, Status, StartType
          }

          $freshInstall = Start-Process -FilePath $installer.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$artifactDir\install-fresh.log") `
            -Wait -PassThru
          if ($freshInstall.ExitCode -ne 0) {
            Write-MMEDiagnostics
            throw "Cài mới thất bại: exit code $($freshInstall.ExitCode)"
          }

          $deadline = (Get-Date).AddSeconds(90)
          do {
            try { $ready = Invoke-RestMethod 'http://127.0.0.1:3000/ready' -TimeoutSec 3 } catch { $ready = $null }
            if ($ready.status -eq 'ready') { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($ready.status -ne 'ready') { Write-MMEDiagnostics; throw 'API không ready sau khi cài mới.' }
          if ((Get-Service MME).Status -ne 'Running') { throw 'Windows Service MME không chạy.' }
          if ((Get-CimInstance Win32_Service -Filter "Name='MME'").StartMode -ne 'Auto') { throw 'Windows Service MME không tự khởi động cùng Windows.' }
          $installedServer = Join-Path $env:ProgramFiles 'MikroTik Manager Enterprise\dist\server.js'
          if (-not (Test-Path $installedServer)) { throw 'Ứng dụng không được cài vào Program Files của ổ hệ thống.' }
          if (-not (Test-Path "$env:ProgramData\MikroTik Manager Enterprise\data\mme.db")) { throw 'SQLite database chưa được tạo.' }

          $upgradeInstall = Start-Process -FilePath $installer.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$artifactDir\install-upgrade.log") `
            -Wait -PassThru
          if ($upgradeInstall.ExitCode -ne 0) {
            Write-MMEDiagnostics
            throw "Nâng cấp tại chỗ không restart thất bại: exit code $($upgradeInstall.ExitCode)"
          }
          $ready = Invoke-RestMethod 'http://127.0.0.1:3000/ready' -TimeoutSec 10
          if ($ready.status -ne 'ready') { throw 'API không ready sau khi nâng cấp.' }
          if ((Get-Service MME).Status -ne 'Running') { throw 'Windows Service MME không chạy sau khi nâng cấp.' }

          $installDir = Join-Path $env:ProgramFiles 'MikroTik Manager Enterprise'
          $uninstaller = Get-ChildItem "$installDir\unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw 'Không tìm thấy uninstaller.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$artifactDir\uninstall.log") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Gỡ cài đặt thất bại: exit code $($uninstall.ExitCode)" }
          if (Get-Service MME -ErrorAction SilentlyContinue) { throw 'Windows Service còn tồn tại sau khi gỡ.' }
          if (-not (Test-Path "$env:ProgramData\MikroTik Manager Enterprise\data\mme.db")) { throw 'Dữ liệu người dùng bị xóa ngoài ý muốn khi gỡ cài đặt.' }

      - name: Tạo checksum SHA-256
        if: always()
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'artifacts/MikroTik-Manager-Enterprise-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Warning 'Chưa có installer để tạo checksum.'
            exit 0
          }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Copy-Item project-docs/deployment/HUONG-DAN-CAI-DAT-WINDOWS.md artifacts/HUONG-DAN-CAI-DAT-WINDOWS.md -Force

      - name: Thu thập chẩn đoán Windows Service
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $validationLog = Join-Path $env:RUNNER_TEMP 'mme-powershell-validation.log'
          if (Test-Path $validationLog) {
            Copy-Item $validationLog artifacts/powershell51-validation.log -Force
          }
          $service = Get-Service MME -ErrorAction SilentlyContinue
          if ($service) {
            $service | Format-List Name, Status, StartType | Out-File artifacts/service-status.log -Encoding utf8
          } else {
            'Windows Service MME không tồn tại tại thời điểm thu thập.' | Out-File artifacts/service-status.log -Encoding utf8
          }
          $serviceLogDir = "$env:ProgramData\MikroTik Manager Enterprise\logs"
          if (Test-Path $serviceLogDir) {
            Get-ChildItem $serviceLogDir -File | ForEach-Object {
              Copy-Item $_.FullName "artifacts/service-$($_.Name)" -Force -ErrorAction Continue
            }
          }

      - name: Upload Windows installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mme-windows-installer-${{ steps.version.outputs.value }}
          path: |
            artifacts/MikroTik-Manager-Enterprise-Setup-*.exe
            artifacts/MikroTik-Manager-Enterprise-Setup-*.exe.sha256
            artifacts/SHA256SUMS.txt
            artifacts/HUONG-DAN-CAI-DAT-WINDOWS.md
            artifacts/*.log
          if-no-files-found: warn

  linux-installer:
    name: Linux DEB Installer
    if: startsWith(github.ref, 'refs/tags/') || inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then version='${{ inputs.version }}'; else version='${{ github.ref_name }}'; version="${version#v}"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          root="artifacts/deb-root"
          app="$root/opt/mikrotik-manager-enterprise"
          mkdir -p "$app" "$root/usr/local/bin" "$root/lib/systemd/system" "$root/DEBIAN" artifacts
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          export DATABASE_URL='file:./mme-build.db'
          pnpm --filter @mme/server prisma:generate:sqlite
          pnpm --filter @mme/server prisma:sql:sqlite
          pnpm --filter @mme/web build
          pnpm --filter @mme/routeros-core build
          pnpm --filter @mme/routeros-sdk build
          pnpm --filter @mme/server build
          pnpm --filter @mme/server deploy --legacy --prod "$app"
          prisma_cli="$(find "$app/node_modules/.pnpm" -path '*/prisma/build/index.js' -print -quit)"
          test -n "$prisma_cli"
          node "$prisma_cli" generate --schema "$app/prisma/schema.sqlite.prisma"
          cp -a apps/web/dist "$app/web"
          mkdir -p "$app/runtime"
          cp "$(command -v node)" "$app/runtime/node"
          chmod 0755 "$app/runtime/node"
          install -m 0755 packaging/linux/mme-control "$root/usr/local/bin/mme-control"
          install -m 0644 packaging/linux/mme.service "$root/lib/systemd/system/mme.service"
          cat > "$root/DEBIAN/control" <<EOF
          Package: mikrotik-manager-enterprise
          Version: $version
          Section: admin
          Priority: optional
          Architecture: amd64
          Depends: openssl, systemd
          Maintainer: MikroTik Manager Enterprise Community
          Description: Enterprise MikroTik controller and monitoring platform
          EOF
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          systemctl daemon-reload
          systemctl enable mme.service
          echo 'Chạy lệnh: sudo mme-control install'
          EOF
          chmod 0755 "$root/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$root" "artifacts/mikrotik-manager-enterprise_${version}_amd64.deb"
          dpkg-deb --info "artifacts/mikrotik-manager-enterprise_${version}_amd64.deb"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: mme-linux-installer-${{ steps.version.outputs.value }}
          path: artifacts/*.deb
          if-no-files-found: error
